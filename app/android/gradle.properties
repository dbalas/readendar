org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.44 can build against AGP 9, but built-in Kotlin requires Flutter
# 3.47+. Several third-party plugins still apply KGP, and Flutter 3.44 defaults
# to these compatibility switches. Keep them until the app can set
# builtInKotlin=true; they do not disable AGP 9 or its R8 optimizations.
# Companion: android/build.gradle.kts applies KGP to library plugins that
# already dropped it (so their Kotlin still compiles while this flag is false).
android.newDsl=false
android.builtInKotlin=false
# text_sight: ship the ML Kit Latin OCR model inside the APK so quote capture
# works offline immediately (parity with the previous google_mlkit path).
com.lahaluhem.text_sight.useBundled=true
