include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/gen/**"
    - "lib/**/generated/**"
    - "build/**"
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    public_member_api_docs: false
    avoid_classes_with_only_static_members: false
    one_member_abstracts: false
    lines_longer_than_80_chars: false
    flutter_style_todos: false
    document_ignores: false
    # Flutter callbacks commonly launch navigation and UI work whose Future is
    # intentionally owned by the framework callback boundary.
    discarded_futures: false
    # Repository and platform boundaries deliberately normalize any thrown
    # object into the app's Failure model.
    avoid_catches_without_on_clauses: false
    # Preserve stable public APIs; these style rules otherwise require broad,
    # behavior-neutral call-site churn.
    avoid_positional_boolean_parameters: false
    cascade_invocations: false
    parameter_assignments: false
    prefer_foreach: false
    # Async filesystem APIs keep tests off the main isolate's blocking path.
    avoid_slow_async_io: false
    # Dependency comments group packages by subsystem instead of alphabetically.
    sort_pub_dependencies: false
