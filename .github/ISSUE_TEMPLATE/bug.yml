name: Bug
description: Something is broken in the app.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security reports go to hello@readendar.com, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 1.2.0 (iOS 18 / Android 15)"
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Flutter app
        - Something else
    validations:
      required: true
